<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Call Test (PeerJS)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        h2 { color: #1e293b; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .video-box { background: white; padding: 10px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        video { width: 400px; height: 300px; background: #000; border-radius: 12px; object-fit: cover; }
        .controls { margin-top: 20px; padding: 20px; background: white; display: inline-block; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 250px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #1d4ed8; }
        .my-id-box { background: #dbeafe; color: #1e3a8a; padding: 10px 20px; border-radius: 8px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Video Call Test</h2>
    <div class="my-id-box">Your ID: <span id="my-id">Generating...</span></div>

    <div class="controls">
        <input type="text" id="friend-id" placeholder="Enter Friend's ID here">
        <button onclick="makeCall()">Call Friend</button>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3 style="margin-top:0;">Local Video (You)</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <h3 style="margin-top:0;">Remote Video (Friend)</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        // បង្កើត Peer Object (វានឹងទាក់ទងទៅ Server របស់ PeerJS ដោយស្វ័យប្រវត្តិ)
        const peer = new Peer(); 

        // ១. បើកកាមេរ៉ា និងម៉ៃក្រូហ្វូន
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream; // បង្ហាញក្នុងប្រអប់កាមេរ៉ាយើង
            })
            .catch(err => {
                console.error("មិនអាចបើកកាមេរ៉ាបានទេ:", err);
                alert("សូមអនុញ្ញាតឱ្យបើកកាមេរ៉ា និងម៉ៃក្រូហ្វូនជាមុនសិន!");
            });

        // ២. ពេលភ្ជាប់ទៅ Server ជោគជ័យ វានឹងផ្តល់ ID មកឱ្យយើង
        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
        });

        // ៣. រង់ចាំទទួលការ Call ចូលពីមិត្តភក្តិ
        peer.on('call', call => {
            if (confirm("មានការខលចូល! តើអ្នកចង់ទទួលឬទេ?")) {
                call.answer(localStream); // ឆ្លើយតបទៅវិញដោយបញ្ជូន Stream យើងទៅគេ
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream; // បង្ហាញរូបគេលើអេក្រង់យើង
                });
            }
        });

        // ៤. មុខងារសម្រាប់ Call ទៅគេ
        function makeCall() {
            const friendId = document.getElementById('friend-id').value;
            if (!friendId) {
                alert("សូមបញ្ចូល ID របស់មិត្តភក្តិជាមុនសិន!");
                return;
            }
            
            // Call ទៅកាន់ ID របស់គេ ព្រមទាំងបញ្ជូន Stream យើងទៅជាមួយ
            const call = peer.call(friendId, localStream);
            
            // ពេលគេឆ្លើយតប វានឹងទទួលបាន Stream របស់គេត្រលប់មកវិញ
            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream; // បង្ហាញរូបគេ
            });
        }
    </script>
</body>
</html>
